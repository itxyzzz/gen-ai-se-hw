{
  "pipelineVersion": "1.0.0",
  "defaultScenario": "bug-001",
  "defaultAdapter": "mock",
  "defaultRunId": "run-001",
  "stageOrder": [
    "bug-researcher",
    "research-verifier",
    "bug-planner",
    "bug-fixer",
    "security-verifier",
    "unit-test-generator"
  ],
  "modelPolicies": {
    "research-high": {
      "provider": "openai",
      "model": "gpt-5.4",
      "reasoningEffort": "high",
      "justification": "Research needs careful file and behavior correlation."
    },
    "verification-high": {
      "provider": "openai",
      "model": "gpt-5.4",
      "reasoningEffort": "high",
      "justification": "Verification protects all downstream stages from bad evidence."
    },
    "planning-high": {
      "provider": "openai",
      "model": "gpt-5.4",
      "reasoningEffort": "high",
      "justification": "Planning translates verified evidence into controlled edits."
    },
    "implementation-medium": {
      "provider": "openai",
      "model": "gpt-5.3-codex",
      "reasoningEffort": "medium",
      "justification": "Implementation is bounded, code-focused work."
    },
    "security-high": {
      "provider": "openai",
      "model": "gpt-5.4",
      "reasoningEffort": "high",
      "justification": "Security review is high-impact and benefits from deeper reasoning."
    },
    "test-medium": {
      "provider": "openai",
      "model": "gpt-5.3-codex",
      "reasoningEffort": "medium",
      "justification": "Unit test generation is bounded coding work against changed files."
    }
  },
  "scenarios": {
    "bug-001": {
      "baselineApp": "app/baseline",
      "currentApp": "app/current",
      "scenarioDir": "scenarios/bug-001",
      "testCommand": "node --test --test-isolation=none tests/*.test.js"
    }
  },
  "requiredArtifacts": [
    "run-metadata.json",
    "app",
    "patch.diff",
    "research/verified-research.md",
    "fix-summary.md",
    "security-report.md",
    "test-report.md",
    "command-log.md"
  ],
  "benchmarkWeights": {
    "correctness": 40,
    "securityRemediation": 25,
    "testQuality": 15,
    "maintainability": 10,
    "reproducibility": 10
  }
}
